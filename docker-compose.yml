services:
  aetherdrive:
    image: ghcr.io/riyaz-hussain/aetherdrive:latest
    container_name: aetherdrive
    ports:
      - "8070:8070"
    environment:
      - DATA_DIR=/appdata
      - DOWNLOAD_DIR=/downloads
    volumes:
      - </volume/DownloadsFolder>:/downloads
      - </volume/docker/appdata/aetherdrive>:/appdata
    restart: unless-stopped
