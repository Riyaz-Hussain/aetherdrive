services:
  aetherdrive:
    image: ghcr.io/riyaz-hussain/aetherdrive:latest
    container_name: aetherdrive
    ports:
      - "8070:8080"
    environment:
      - DATA_DIR=/app/data
      - DOWNLOAD_DIR=/downloads
    volumes:
      - ./downloads:/downloads
      - aether_data:/app/data
    restart: unless-stopped

volumes:
  aether_data:
