<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AetherDrive</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white"
      x-data="aetherApp()" x-init="initApp()">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 flex-shrink-0">
        <i class="fa-solid fa-cloud-arrow-down text-base sm:text-lg text-white"></i>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">AetherDrive</h1>
        <p class="text-[10px] sm:text-xs text-slate-400 hidden xs:block">Sanitizer & Batch Downloader</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Cookie Session Status Button -->
      <button @click="openCookieModal()" 
              class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition-colors"
              :class="cookieStatus.has_cookies ? 'bg-emerald-950/50 border-emerald-700/60 text-emerald-300 hover:bg-emerald-900/50' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'">
        <span class="w-2 h-2 rounded-full" :class="cookieStatus.has_cookies ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'"></span>
        <i class="fa-solid fa-cookie-bite"></i>
        <span class="hidden sm:inline" x-text="cookieStatus.has_cookies ? 'Session Active' : 'Session'"></span>
      </button>

      <!-- Exclusions Button -->
      <button @click="showExclusionsModal = true" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">
        <i class="fa-solid fa-filter text-indigo-400 sm:mr-1"></i> <span class="hidden sm:inline">Exclusions</span>
      </button>

      <!-- History Drawer Button -->
      <button @click="openHistoryDrawer()" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">
        <i class="fa-solid fa-clock-rotate-left text-indigo-400 sm:mr-1"></i> <span class="hidden sm:inline">History</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 space-y-4 sm:space-y-6">

    <!-- Persistent Completion Banner -->
    <template x-if="completedSummary">
      <div class="p-3.5 sm:p-4 rounded-xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-xl transition-all"
           :class="completedSummary.status === 'Success' ? 'bg-emerald-950/50 border-emerald-800/80 text-emerald-200' : 'bg-amber-950/50 border-amber-800/80 text-amber-200'">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-lg flex-shrink-0"
               :class="completedSummary.status === 'Success' ? 'bg-emerald-800/50 text-emerald-400' : 'bg-amber-800/50 text-amber-400'">
            <i :class="completedSummary.status === 'Success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-triangle-exclamation'"></i>
          </div>
          <div>
            <h4 class="text-xs sm:text-sm font-semibold" x-text="completedSummary.status === 'Success' ? 'Batch Download Complete' : 'Execution Finished with Warnings'"></h4>
            <p class="text-[11px] sm:text-xs opacity-80" x-text="`Folder: ${completedSummary.folder} | Files: ${completedSummary.downloaded}/${completedSummary.total} (Failed: ${completedSummary.failed})`"></p>
          </div>
        </div>
        <button @click="startNewTask()" class="w-full sm:w-auto px-3 py-1.5 bg-slate-900 border border-slate-700 hover:border-slate-500 text-white rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 shadow">
          <i class="fa-solid fa-plus"></i> Start New Task
        </button>
      </div>
    </template>

    <!-- Inspection Bar -->
    <div class="bg-slate-900/70 border border-slate-800 p-3 sm:p-4 rounded-2xl shadow-sm">
      <div class="flex flex-col sm:flex-row gap-2.5 sm:gap-3">
        <div class="relative flex-1">
          <i class="fa-brands fa-google-drive absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="text" x-model="driveUrl" placeholder="Paste Google Drive folder link..."
                 :disabled="isRunning || isScanning"
                 @keydown.enter="scanFolder()"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 disabled:opacity-50 transition" />
        </div>
        <button @click="scanFolder()" :disabled="!driveUrl.trim() || isRunning || isScanning"
                class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-wand-magic-sparkles" :class="isScanning ? 'fa-spin' : ''"></i>
          <span x-text="isScanning ? 'Inspecting...' : 'Inspect & Plan'"></span>
        </button>
      </div>
    </div>

    <!-- Live SSE Execution Stream (At the Top) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-terminal text-xs text-indigo-400"></i>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Live Execution Stream</h3>
        </div>
        <div class="text-xs text-slate-400">
          <template x-if="isRunning">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
              <span class="font-mono text-emerald-300 truncate max-w-[200px] sm:max-w-sm" x-text="`${progress.active_file || 'Downloading...'} (${progress.current}/${progress.total})`"></span>
            </div>
          </template>
          <template x-if="!isRunning">
            <span class="font-mono text-slate-500">Idle / Ready</span>
          </template>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-950 rounded-full h-2 sm:h-2.5 overflow-hidden border border-slate-800">
        <div class="bg-gradient-to-r from-indigo-500 via-sky-400 to-emerald-400 h-full transition-all duration-300"
             :style="`width: ${progress.percent}%`"></div>
      </div>

      <!-- Terminal Output Window -->
      <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 font-mono text-xs text-slate-300 h-36 sm:h-44 overflow-y-auto space-y-1"
           id="terminalLogs">
        <template x-for="(log, idx) in logs" :key="idx">
          <div class="leading-relaxed break-all" x-text="log"></div>
        </template>
        <template x-if="logs.length === 0">
          <div class="text-slate-600 italic">Logs and download events will stream here in real time...</div>
        </template>
      </div>
    </div>

    <!-- Active Plan & Workspace -->
    <template x-if="plan">
      <div class="space-y-4">
        <!-- Plan Controls & Destination Field -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm space-y-4">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <!-- Destination Folder -->
            <div class="flex-1 max-w-xl w-full">
              <label class="block text-xs font-medium text-slate-400 mb-1.5">Destination Directory (under /downloads/)</label>
              <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                <input type="text" x-model="plan.destination_folder"
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none" />
                <div class="flex items-center gap-2">
                  <span class="text-[11px] px-2.5 py-2 rounded-lg border flex items-center justify-center gap-1.5 whitespace-nowrap flex-1 sm:flex-initial"
                        :class="plan.destination_exists_on_disk ? 'bg-amber-950/40 border-amber-800 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-400'">
                    <i :class="plan.destination_exists_on_disk ? 'fa-solid fa-folder-open' : 'fa-solid fa-folder-plus'"></i>
                    <span x-text="plan.destination_exists_on_disk ? 'Exists on disk' : 'New Folder'"></span>
                  </span>
                  <button @click="reapplyRules()" title="Reapply exclusions"
                          class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium transition border border-slate-700">
                    <i class="fa-solid fa-rotate mr-1"></i> Re-Apply
                  </button>
                </div>
              </div>
            </div>

            <!-- Execution Actions -->
            <div class="flex items-center gap-2 pt-2 sm:pt-0 w-full lg:w-auto">
              <label class="flex flex-1 sm:flex-initial md:hidden items-center justify-center gap-2 px-3 py-2 text-xs font-medium rounded-xl border border-slate-700 text-slate-300">
                <input type="checkbox" :checked="allDisplayedItemsSelected" @change="setAllSelected($event.target.checked)"
                       class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer" />
                <span>Select All</span>
              </label>
              <template x-if="!isRunning">
                <button @click="startDownload()" :disabled="selectedCount === 0"
                        class="flex-1 sm:flex-initial px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
                  <i class="fa-solid fa-play"></i>
                  <span>Execute (<span x-text="selectedCount"></span>)</span>
                </button>
              </template>
              <template x-if="isRunning">
                <button @click="cancelTask()" class="flex-1 sm:flex-initial px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-rose-600/20">
                  <i class="fa-solid fa-stop"></i>
                  <span>Cancel Job</span>
                </button>
              </template>
            </div>
          </div>

          <!-- Filter Category Tabs -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 pt-2 border-t border-slate-800/80">
            <button @click="activeTab = 'all'" :class="activeTab === 'all' ? 'bg-indigo-950/60 border-indigo-500/80 text-white' : 'bg-slate-950 border-slate-800/80 text-slate-400 hover:bg-slate-800/40'"
                    class="p-2 sm:p-2.5 rounded-xl border text-left transition flex items-center justify-between">
              <div>
                <span class="block text-[11px] sm:text-xs font-medium">Total</span>
                <span class="text-xs sm:text-sm font-bold" x-text="plan.items.length"></span>
              </div>
              <i class="fa-solid fa-list text-slate-500 text-xs sm:text-sm"></i>
            </button>
            <button @click="activeTab = 'approved'" :class="activeTab === 'approved' ? 'bg-emerald-950/60 border-emerald-500/80 text-white' : 'bg-slate-950 border-slate-800/80 text-slate-400 hover:bg-slate-800/40'"
                    class="p-2 sm:p-2.5 rounded-xl border text-left transition flex items-center justify-between">
              <div>
                <span class="block text-[11px] sm:text-xs font-medium">Approved</span>
                <span class="text-xs sm:text-sm font-bold text-emerald-400" x-text="approvedItems.length"></span>
              </div>
              <i class="fa-solid fa-circle-check text-emerald-500 text-xs sm:text-sm"></i>
            </button>
            <button @click="activeTab = 'on_disk'" :class="activeTab === 'on_disk' ? 'bg-blue-950/60 border-blue-500/80 text-white' : 'bg-slate-950 border-slate-800/80 text-slate-400 hover:bg-slate-800/40'"
                    class="p-2 sm:p-2.5 rounded-xl border text-left transition flex items-center justify-between">
              <div>
                <span class="block text-[11px] sm:text-xs font-medium">On Disk</span>
                <span class="text-xs sm:text-sm font-bold text-blue-400" x-text="onDiskItems.length"></span>
              </div>
              <i class="fa-solid fa-hard-drive text-blue-500 text-xs sm:text-sm"></i>
            </button>
            <button @click="activeTab = 'bloat'" :class="activeTab === 'bloat' ? 'bg-amber-950/60 border-amber-500/80 text-white' : 'bg-slate-950 border-slate-800/80 text-slate-400 hover:bg-slate-800/40'"
                    class="p-2 sm:p-2.5 rounded-xl border text-left transition flex items-center justify-between">
              <div>
                <span class="block text-[11px] sm:text-xs font-medium">Bloat</span>
                <span class="text-xs sm:text-sm font-bold text-amber-400" x-text="bloatItems.length"></span>
              </div>
              <i class="fa-solid fa-ban text-amber-500 text-xs sm:text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Filtered Items Table & Mobile Cards -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-sm">
          <!-- Desktop Table -->
          <div class="hidden md:block max-h-[380px] overflow-y-auto">
            <table class="w-full text-left text-xs border-collapse">
              <thead class="sticky top-0 bg-slate-950 border-b border-slate-800 text-slate-400 font-semibold z-10">
                <tr>
                  <th class="py-2.5 px-2 w-16 text-center">
                    <label class="inline-flex items-center justify-center gap-1.5 cursor-pointer" title="Select all visible items">
                      <span>Sel</span>
                      <input type="checkbox" :checked="allDisplayedItemsSelected" @change="setAllSelected($event.target.checked)"
                             aria-label="Select all visible items"
                             class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer" />
                    </label>
                  </th>
                  <th class="py-2.5 px-4">Sanitized Path</th>
                  <th class="py-2.5 px-4">Original Google Drive Path</th>
                  <th class="py-2.5 px-4 w-24 text-right">Size</th>
                  <th class="py-2.5 px-4 w-28 text-center">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                <template x-for="(item, idx) in displayedItems" :key="idx">
                  <tr class="hover:bg-slate-800/40 transition">
                    <td class="py-2.5 px-4 text-center">
                      <input type="checkbox" x-model="item.selected" class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer" />
                    </td>
                    <td class="py-2.5 px-4 font-mono text-slate-200" x-text="item.sanitized_path"></td>
                    <td class="py-2.5 px-4 font-mono text-slate-500 truncate max-w-xs" x-text="item.original_path"></td>
                    <td class="py-2.5 px-4 text-right text-slate-400 whitespace-nowrap" x-text="item.size_str"></td>
                    <td class="py-2.5 px-4 text-center">
                      <span class="px-2 py-0.5 rounded text-[10px] font-semibold tracking-wide uppercase"
                            :class="{
                              'bg-emerald-950/80 text-emerald-400 border border-emerald-800/60': item.category === 'approved',
                              'bg-blue-950/80 text-blue-400 border border-blue-800/60': item.category === 'on_disk',
                              'bg-amber-950/80 text-amber-400 border border-amber-800/60': item.category === 'bloat'
                            }"
                            x-text="item.category === 'approved' ? 'Approved' : (item.category === 'on_disk' ? 'On Disk' : 'Bloat')">
                      </span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Mobile Cards -->
          <div class="block md:hidden max-h-[380px] overflow-y-auto divide-y divide-slate-800/60 p-2 space-y-2">
            <template x-for="(item, idx) in displayedItems" :key="idx">
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800/80 text-xs space-y-2">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <input type="checkbox" x-model="item.selected" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer" />
                    <span class="font-mono text-slate-200 break-all" x-text="item.sanitized_path"></span>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[10px] font-semibold tracking-wide uppercase whitespace-nowrap flex-shrink-0"
                        :class="{
                          'bg-emerald-950/80 text-emerald-400 border border-emerald-800/60': item.category === 'approved',
                          'bg-blue-950/80 text-blue-400 border border-blue-800/60': item.category === 'on_disk',
                          'bg-amber-950/80 text-amber-400 border border-amber-800/60': item.category === 'bloat'
                        }"
                        x-text="item.category === 'approved' ? 'Approved' : (item.category === 'on_disk' ? 'On Disk' : 'Bloat')">
                  </span>
                </div>
                <div class="flex items-center justify-between text-slate-500 text-[11px] pl-6 font-mono">
                  <span class="truncate max-w-[200px]" x-text="item.original_path"></span>
                  <span x-text="item.size_str"></span>
                </div>
              </div>
            </template>
            <template x-if="displayedItems.length === 0">
              <div class="py-8 text-center text-slate-500 text-xs">No items in this category filter.</div>
            </template>
          </div>
        </div>
      </div>
    </template>

  </main>

  <!-- Cookie Session Modal -->
  <div x-show="showCookieModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm"
       @click.self="showCookieModal = false">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-950 border border-emerald-700/60 flex items-center justify-center text-emerald-400 text-xs">
            <i class="fa-solid fa-cookie-bite"></i>
          </div>
          <h3 class="text-sm font-bold text-white">Google Drive Session / Cookies</h3>
        </div>
        <button @click="showCookieModal = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
        <div>
          <span class="text-slate-400 block">Status:</span>
          <span class="font-semibold" :class="cookieStatus.has_cookies ? 'text-emerald-400' : 'text-slate-400'"
                x-text="cookieStatus.has_cookies ? 'Authenticated Session Active' : 'No Cookies Configured (Anonymous)'"></span>
          <template x-if="cookieStatus.has_cookies">
            <span class="text-[11px] text-slate-500 block" x-text="`Size: ${cookieStatus.file_size} bytes | Saved: ${cookieStatus.last_modified}`"></span>
          </template>
        </div>
        <template x-if="cookieStatus.has_cookies">
          <button @click="deleteCookies()" class="px-2.5 py-1 bg-rose-950/50 border border-rose-800 text-rose-300 hover:bg-rose-900 rounded-lg text-xs font-medium transition">
            Clear Session
          </button>
        </template>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Paste Netscape cookies.txt content:</label>
        <textarea x-model="cookieInput" rows="7" placeholder="# Netscape HTTP Cookie File&#10;.google.com	TRUE	/	TRUE	...&#10;.drive.google.com	TRUE	/	TRUE	..."
                  class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500"></textarea>
        <p class="text-[11px] text-slate-500 mt-1">Export cookies from Chrome/Firefox using <i>Get cookies.txt LOCALLY</i> while logged in to Google Drive.</p>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
        <button @click="showCookieModal = false" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition">Cancel</button>
        <button @click="saveCookies()" :disabled="!cookieInput.trim()"
                class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-floppy-disk"></i> Save & Activate
        </button>
      </div>
    </div>
  </div>

  <!-- Exclusions Rules Modal -->
  <div x-show="showExclusionsModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm"
       @click.self="showExclusionsModal = false">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-filter text-indigo-400 text-sm"></i>
          <h3 class="text-sm font-bold text-white">Bloatware & Promo Wildcard Rules</h3>
        </div>
        <button @click="showExclusionsModal = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Active Rules (one pattern per line):</label>
        <textarea x-model="exclusionsText" rows="8"
                  class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
        <button @click="showExclusionsModal = false" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition">Cancel</button>
        <button @click="saveExclusions()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition">Save Rules</button>
      </div>
    </div>
  </div>

  <!-- Execution Audit Log Drawer (Click outside to dismiss) -->
  <div x-show="showHistoryDrawer" x-cloak 
       class="fixed inset-0 z-50 overflow-hidden bg-slate-950/70 backdrop-blur-sm flex justify-end"
       @click.self="showHistoryDrawer = false">
    <div class="w-full sm:max-w-xl bg-slate-900 border-l border-slate-800 h-full p-4 sm:p-6 flex flex-col justify-between shadow-2xl">
      <div class="space-y-4 overflow-y-auto pr-1">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i>
            <h3 class="text-sm font-bold text-white">Execution Audit Log</h3>
          </div>
          <button @click="showHistoryDrawer = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="space-y-3">
          <template x-for="item in historyList" :key="item.id">
            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-semibold text-slate-200" x-text="item.folder_name"></span>
                <span class="text-[10px] px-2 py-0.5 rounded font-mono uppercase"
                      :class="item.status === 'Success' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'"
                      x-text="item.status"></span>
              </div>
              <div class="text-slate-400 text-[11px] flex items-center justify-between">
                <span x-text="item.timestamp"></span>
                <span x-text="`Files: ${item.downloaded_files}/${item.total_files} (Failed: ${item.failed_files})`"></span>
              </div>
              <!-- URL and Action Buttons Row -->
              <div class="pt-1.5 border-t border-slate-800/80 flex items-center justify-between gap-2">
                <span class="font-mono text-slate-500 text-[10px] truncate max-w-[180px] sm:max-w-[240px]" x-text="item.url || 'No URL stored'"></span>
                <div class="flex items-center gap-1.5">
                  <template x-if="item.url">
                    <div class="flex items-center gap-1.5">
                      <button @click="copyHistoryUrl(item)" 
                              class="px-2 py-1 rounded text-[11px] transition flex items-center gap-1"
                              :class="copiedId === item.id ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-700/60' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'">
                        <i :class="copiedId === item.id ? 'fa-solid fa-check text-emerald-400' : 'fa-regular fa-copy'"></i>
                        <span x-text="copiedId === item.id ? 'Copied!' : 'Copy'"></span>
                      </button>
                      <button @click="useHistoryUrl(item.url)" class="px-2 py-1 rounded bg-indigo-950/70 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-300 text-[11px] transition flex items-center gap-1">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Use Link
                      </button>
                    </div>
                  </template>
                  <button @click="deleteHistoryItem(item.id)" class="p-1 text-slate-500 hover:text-rose-400 transition ml-1">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </template>
          <template x-if="historyList.length === 0">
            <div class="py-12 text-center text-slate-500 text-xs">No audit logs recorded yet.</div>
          </template>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
        <button @click="clearAllHistory()" :disabled="historyList.length === 0"
                class="px-3 py-1.5 text-xs text-rose-400 hover:bg-rose-950/40 border border-rose-900/60 rounded-lg transition disabled:opacity-40">
          Clear All Records
        </button>
        <button @click="showHistoryDrawer = false" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs">Close</button>
      </div>
    </div>
  </div>

  <script>
    function aetherApp() {
      return {
        driveUrl: '',
        isScanning: false,
        isRunning: false,
        plan: null,
        activeTab: 'all',
        logs: [],
        progress: { current: 0, total: 0, percent: 0, speed: '', active_file: '' },
        completedSummary: null,
        showCookieModal: false,
        cookieInput: '',
        cookieStatus: { has_cookies: false, file_size: 0, last_modified: '' },
        showExclusionsModal: false,
        exclusionsText: '',
        showHistoryDrawer: false,
        historyList: [],
        copiedId: null,

        async initApp() {
          this.fetchCookieStatus();
          this.fetchExclusions();
          this.initSSE();
        },

        async fetchCookieStatus() {
          try {
            const res = await fetch('/api/cookies/status');
            this.cookieStatus = await res.json();
          } catch (e) {
            console.error('Failed to load cookie status', e);
          }
        },

        openCookieModal() {
          this.fetchCookieStatus();
          this.showCookieModal = true;
        },

        async saveCookies() {
          try {
            const res = await fetch('/api/cookies', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cookie_content: this.cookieInput })
            });
            if (res.ok) {
              this.cookieInput = '';
              this.showCookieModal = false;
              await this.fetchCookieStatus();
            }
          } catch (e) {
            alert('Failed to save cookies: ' + e);
          }
        },

        async deleteCookies() {
          if (!confirm('Revert to anonymous mode and delete saved cookies?')) return;
          try {
            await fetch('/api/cookies', { method: 'DELETE' });
            await this.fetchCookieStatus();
          } catch (e) {
            console.error(e);
          }
        },

        initSSE() {
          const evt = new EventSource('/api/events');
          evt.addEventListener('log', (e) => {
            const data = JSON.parse(e.data);
            this.logs.push(data.message);
            this.$nextTick(() => {
              const el = document.getElementById('terminalLogs');
              if (el) el.scrollTop = el.scrollHeight;
            });
          });
          evt.addEventListener('status', (e) => {
            const data = JSON.parse(e.data);
            this.isRunning = data.is_running;
            this.progress = data.progress;
            if (!this.isScanning) {
              this.completedSummary = data.completed_summary;
            }
          });
        },

        async scanFolder() {
          if (!this.driveUrl.trim()) return;
          this.completedSummary = null;
          this.isScanning = true;
          try {
            const res = await fetch('/api/scan', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: this.driveUrl.trim() })
            });
            if (!res.ok) {
              const err = await res.json();
              throw new Error(err.detail || 'Failed to scan');
            }
            this.plan = await res.json();
            this.activeTab = 'approved';
          } catch (e) {
            alert(e.message);
          } finally {
            this.isScanning = false;
          }
        },

        async reapplyRules() {
          if (!this.plan) return;
          try {
            const res = await fetch('/api/reapply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ destination_folder: this.plan.destination_folder })
            });
            if (res.ok) {
              this.plan = await res.json();
            }
          } catch (e) {
            console.error(e);
          }
        },

        async startDownload() {
          if (!this.plan) return;
          this.completedSummary = null;
          const payload = {
            destination_folder: this.plan.destination_folder,
            url: this.driveUrl.trim(),
            items: this.plan.items
          };
          try {
            await fetch('/api/download', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          } catch (e) {
            alert('Failed to start download: ' + e);
          }
        },

        async cancelTask() {
          try {
            await fetch('/api/cancel', { method: 'POST' });
          } catch (e) {
            console.error(e);
          }
        },

        async startNewTask() {
          try {
            await fetch('/api/reset', { method: 'POST' });
            this.plan = null;
            this.completedSummary = null;
            this.driveUrl = '';
            this.logs = [];
          } catch (e) {
            console.error(e);
          }
        },

        setAllSelected(selected) {
          if (!this.plan) return;
          this.displayedItems.forEach(item => item.selected = selected);
        },

        get approvedItems() {
          return (this.plan?.items || []).filter(i => i.category === 'approved');
        },
        get onDiskItems() {
          return (this.plan?.items || []).filter(i => i.category === 'on_disk');
        },
        get bloatItems() {
          return (this.plan?.items || []).filter(i => i.category === 'bloat');
        },
        get displayedItems() {
          if (!this.plan) return [];
          if (this.activeTab === 'approved') return this.approvedItems;
          if (this.activeTab === 'on_disk') return this.onDiskItems;
          if (this.activeTab === 'bloat') return this.bloatItems;
          return this.plan.items;
        },
        get allDisplayedItemsSelected() {
          return this.displayedItems.length > 0 && this.displayedItems.every(item => item.selected);
        },
        get selectedCount() {
          return (this.plan?.items || []).filter(i => i.selected).length;
        },

        async fetchExclusions() {
          try {
            const res = await fetch('/api/exclusions');
            const data = await res.json();
            this.exclusionsText = data.exclusions.join('\n');
          } catch (e) {
            console.error(e);
          }
        },

        async saveExclusions() {
          const list = this.exclusionsText.split('\n').map(s => s.trim()).filter(Boolean);
          try {
            await fetch('/api/exclusions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ patterns: list })
            });
            this.showExclusionsModal = false;
            if (this.plan) this.reapplyRules();
          } catch (e) {
            alert('Failed to save exclusions: ' + e);
          }
        },

        async openHistoryDrawer() {
          try {
            const res = await fetch('/api/history');
            const data = await res.json();
            this.historyList = data.history;
            this.showHistoryDrawer = true;
          } catch (e) {
            console.error(e);
          }
        },

        async deleteHistoryItem(id) {
          try {
            await fetch(`/api/history/${id}`, { method: 'DELETE' });
            this.historyList = this.historyList.filter(item => item.id !== id);
          } catch (e) {
            console.error(e);
          }
        },

        async clearAllHistory() {
          if (!confirm('Clear all historical execution records from SQLite?')) return;
          try {
            await fetch('/api/history', { method: 'DELETE' });
            this.historyList = [];
          } catch (e) {
            console.error(e);
          }
        },

        copyHistoryUrl(item) {
          if (!item.url) return;
          navigator.clipboard.writeText(item.url).then(() => {
            this.copiedId = item.id;
            setTimeout(() => {
              if (this.copiedId === item.id) {
                this.copiedId = null;
              }
            }, 2000);
          });
        },

        useHistoryUrl(url) {
          this.driveUrl = url;
          this.showHistoryDrawer = false;
          this.scanFolder();
        }
      }
    }
  </script>
</body>
</html>
